[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nba-stat-analyzer"
version = "0.1.0"
description = "Production-oriented NBA analytics and shot-quality ML service"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.53.0",
  "nba-api==1.11.4",
  "numpy==2.5.3",
  "pandas==3.0.5",
  "pydantic==2.13.5",
  "google-genai==2.23.0",
  "python-dotenv==1.2.3",
  "requests==2.34.2",
  "scikit-learn==1.9.1",
  "joblib==1.6.0",
  "duckdb==1.5.5",
  "pyarrow==25.0.1",
  "prometheus-client==0.26.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "hypothesis==6.138.15",
  "mypy==1.18.2",
  "pandas-stubs==2.3.2.250827",
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "ruff==0.13.1",
  "types-requests==2.32.4.20250913",
]
ml = [
  "mlflow-skinny==3.4.0",
  "optuna==4.5.0",
  "shap==0.49.1",
  "xgboost==3.0.5",
]
inference = [
  "xgboost==3.0.5",
]
pipeline = [
  "boto3==1.40.40",
]
load = [
  "locust==2.46.3",
]

[project.scripts]
nba-pipeline = "app.pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: exercises multiple application layers without live third-party calls",
  "slow: intentionally expensive model or load checks",
]
filterwarnings = [
  "ignore:Using .*starlette.testclient.*:Warning",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/ai/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"scripts/*" = ["E402"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["nba_api.*", "joblib.*", "sklearn.*", "shap.*", "xgboost.*", "mlflow.*", "pyarrow.*", "boto3.*"]
ignore_missing_imports = true

name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv lock --check
      - run: uv run ruff check app scripts tests
      - run: uv run mypy app
      - run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml
      - run: uv run python scripts/export_openapi.py
      - run: git diff --exit-code openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run generate:api
      - run: git diff --exit-code src/lib/schema.d.ts
      - run: npm run lint -- --deny-warnings
      - run: npm run test
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: nba-stat-analyzer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: |
          docker run -d --name nba-stat-analyzer-ci -p 8000:8000 nba-stat-analyzer:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/live; then
              curl --fail --silent http://127.0.0.1:8000/health/ready
              exit 0
            fi
            sleep 2
          done
          docker logs nba-stat-analyzer-ci
          exit 1
